name: Daily expire

on:
  schedule:
    # 02:00 IST = 20:30 UTC (the previous calendar day)
    - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Run expiry job
        run: |
          curl -sf \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://auction.bizsocio.com/api/cron/expire"
