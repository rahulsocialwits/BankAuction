name: Ingest bank auction listings

on:
  # Manual only. The automatic schedule now lives in tick.yml (one secret instead of five).
  workflow_dispatch:
    inputs:
      source:
        description: "Source key to ingest"
        default: "bankauctions"
      limit:
        description: "Max pages to process this run"
        default: "250"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_EXTRACTOR_MODEL: ${{ secrets.AI_EXTRACTOR_MODEL }}
        run: npm run ingest -- ${{ github.event.inputs.source || 'bankauctions' }} ${{ github.event.inputs.limit || '250' }}
