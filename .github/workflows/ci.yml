name: CI (tests and type-check)

# Runs on every pull request and every push to main. Read-only: no secrets, no database, no ingestion.
# The placeholder URLs below only satisfy Prisma's config check; nothing connects to them.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
