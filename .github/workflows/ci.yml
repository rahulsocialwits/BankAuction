name: CI (lint, type-check, tests and build)

# Runs on every pull request and every push to main.
# Uses placeholder local-only URLs and dummy auth values; no secrets, database, or ingestion.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      ADMIN_SESSION_SECRET: ci-only-placeholder-session-secret-not-for-production
      ADMIN_PASSWORD: ci-only-placeholder-password
      USER_SESSION_SECRET: ci-only-placeholder-user-session-secret
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
