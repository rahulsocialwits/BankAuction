name: Scheduler tick

# Calls the site's own /api/cron/ingest every 5 minutes.
# The endpoint must finish the tick synchronously and return HTTP 200.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing"; exit 1
          fi
          code=$(curl -sS -o response.txt -w "%{http_code}" --max-time 240             -H "x-cron-secret: $CRON_SECRET"             "https://auction.bizsocio.com/api/cron/ingest?limit=100&wait=1")
          echo "HTTP $code"
          cat response.txt
          echo
          if [ "$code" != "200" ]; then
            echo "Scheduler endpoint did not complete synchronously."
            exit 1
          fi
