name: Scheduler tick

# Calls the site's own /api/cron/ingest every 5 minutes.
# The endpoint runs the whole tick INSIDE the request and answers only when it is finished:
# HTTP 200 + {"ok":true,...} = the work was done; anything else (401 wrong secret, 500 with the real error) fails this job.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduler-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Trigger tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is missing"; exit 1
          fi
          code=$(curl -sS -o response.txt -w "%{http_code}" --max-time 295 \
            -H "x-cron-secret: $CRON_SECRET" \
            "https://auction.bizsocio.com/api/cron/ingest?limit=100")
          echo "HTTP $code"
          head -c 3000 response.txt
          echo
          if [ "$code" != "200" ]; then
            echo "Scheduler endpoint did not complete successfully (HTTP $code)."
            exit 1
          fi
          grep -q '"ok":true' response.txt || { echo "Response did not contain ok:true"; exit 1; }
