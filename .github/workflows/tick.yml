name: Scheduler tick

# Calls the site's own /api/cron/ingest every 30 minutes. The work runs on Vercel, so this job needs only
# ONE secret (CRON_SECRET, the same value as in Vercel). GitHub may start scheduled jobs a few minutes late.
on:
  schedule:
    - cron: "7,37 * * * *"
    # AI scan slots, in UTC: 00:00, 06:00, 12:00, 18:00 IST (UTC+05:30) = 18:30 (previous day), 00:30, 06:30, 12:30 UTC.
    # The site itself decides in code (Asia/Kolkata) whether AI may run; this just makes a tick start right at the slot.
    - cron: "30 18,0,6,12 * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Add the repository secret CRON_SECRET (Settings > Secrets and variables > Actions)."; exit 1
          fi
          code=$(curl -sS -o response.txt -w "%{http_code}" --max-time 60 \
            -H "x-cron-secret: $CRON_SECRET" \
            "https://auction.bizsocio.com/api/cron/ingest?limit=100")
          echo "HTTP $code"; cat response.txt; echo
          [ "$code" = "202" ] || [ "$code" = "200" ]
